# Home Assistant volgt de branch waarmee de repository ooit is toegevoegd
# (claude/optimistic-heisenberg-l0vlui). Houd die gelijk aan main, zodat
# updates op main ook in Home Assistant verschijnen.
name: Sync HA-branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/claude/optimistic-heisenberg-l0vlui
