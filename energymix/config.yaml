name: Energymix
version: "0.2.6"
slug: energymix
description: Energieplanner op basis van Tibber-prijzen voor Victron, zonnepanelen en Zappi
url: https://github.com/riemers/energymix
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: Energymix
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web-UI buiten HA (optioneel, bv. als app op je telefoon)

options:
  tibber_token: ""
  price_resolution: HOURLY
  timezone: Europe/Amsterdam
  mqtt_host: ""
  mqtt_port: 1883
  victron_portal_id: ""
  victron_vebus_instance: "276"
  carcharger_select_entity: input_select.carcharger
  vannacht_entity: input_boolean.vannacht
  battery_soc_entity: sensor.victron_battery_soc
  solar_today_entity: sensor.energy_production_today
  sunchance_entity: ""
  pv_switch_entity: ""
  zappi_plug_entity: ""
  zappi_status_entity: ""
  zappi_mode_entity: ""
  cars: []
  battery_capacity_kwh: 47
  cheap_price: 0.10
  force_fast_price: 0.15
  control:
    pv: false
    ess: false
    dvcc: false
    zappi: false
    feed_in: false
    setpoint: false

schema:
  tibber_token: password
  price_resolution: list(HOURLY|QUARTER_HOURLY)
  timezone: str
  ha_url: url?
  ha_token: password?
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  victron_portal_id: str
  victron_vebus_instance: str
  carcharger_select_entity: str
  vannacht_entity: str?
  battery_soc_entity: str
  solar_today_entity: str
  battery_soc_source: str?
  solar_remaining_entity: str?
  solar_tomorrow_entity: str?
  pv_power_entity: str?
  grid_power_entity: str?
  battery_power_entity: str?
  house_power_entity: str?
  zappi_power_entity: str?
  sunchance_entity: str?
  pv_switch_entity: str?
  zappi_plug_entity: str?
  zappi_status_entity: str?
  zappi_mode_entity: str?
  cars:
    - name: str
      max_range_km: float
      cable_entity: str
      location_entity: str
      range_entity: str
      kwh_per_km: float?
  has_battery: bool?
  grid_phases: int(1,3)?
  grid_phase_max_a: float?
  grid_phase_margin_a: float?
  grid_voltage: float?
  grid_l1_entity: str?
  grid_l2_entity: str?
  grid_l3_entity: str?
  victron_phases: str?
  zappi_phases: int(1,3)?
  grid_max_import_w: int?
  grid_margin_w: int?
  zappi_max_w: int?
  export_max_w: int?
  grid_setpoint_default_w: int?
  roundtrip_efficiency: float(0.5,1)?
  dvcc_step_a: int?
  battery_target_soc: int(50,100)?
  battery_reserve_soc: int(5,90)?
  house_load_default_w: int?
  arbitrage_min_spread: float?
  export_min_spread: float?
  export_price: list(total|energy)?
  energy_tax_eur: float?
  export_enabled: bool?
  grid_charge_enabled: bool?
  season_mode: list(auto|day|night)?
  car_min_range_km: int?
  car_ready_time: str?
  car_opportunistic_price: float?
  regulator_seconds: int(10,300)?
  create_helpers: bool?
  battery_capacity_kwh: float
  battery_nominal_voltage: float?
  charge_efficiency: float(0.5,1)?
  dvcc_max_charge_current: int?
  dvcc_min_charge_current: int?
  cheap_price: float
  force_fast_price: float
  solar_skip_grid_charge: bool?
  solar_skip_grid_charge_buffer: float?
  lowest_price_ess_minutes: int?
  lowest_price_ess_soc_below: float?
  lowest_price_ess_solar_below: float?
  charge_speed_km_per_hour: float?
  default_charge_minutes: int?
  vannacht_ready_hour: int(0,23)?
  eco_battery_soc_min: float?
  eco_solar_min: float?
  eco_sunchance_min: float?
  eco_morning_start_hour: int(0,23)?
  eco_morning_end_hour: int(0,24)?
  interval_minutes: int(5,60)?
  horizon_hours: int(12,48)?
  control:
    pv: bool
    ess: bool
    dvcc: bool
    zappi: bool
    feed_in: bool
    setpoint: bool?
